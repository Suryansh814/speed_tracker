<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SpeedTracker Camera</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            color: white;

            font-family: Arial, sans-serif;

            overflow: hidden;

        }


        #camera {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            background: #000;

        }


        .controls {

            position: fixed;

            bottom: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 10px;

            z-index: 10;

        }


        button {

            border: none;

            border-radius: 8px;

            padding:
                12px 20px;

            font-size: 15px;

            font-weight: bold;

            color: white;

            background: #00a83b;

        }


        button.stop {

            background: #d62828;

        }


        button:disabled {

            opacity: 0.4;

        }


        #status {

            position: fixed;

            top: 15px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            padding:
                8px 14px;

            border-radius: 20px;

            background:
                rgba(0,0,0,0.65);

            font-size: 13px;

        }


        .orientation {

            position: fixed;

            top: 50px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            background:
                rgba(0,0,0,0.65);

            padding:
                6px 10px;

            border-radius: 6px;

            font-size: 12px;

        }

    </style>

</head>


<body>


<video
    id="camera"
    autoplay
    playsinline
    muted
></video>


<div id="status">
    Camera stopped
</div>


<div class="orientation">
    📱 Keep phone in LANDSCAPE
</div>


<div class="controls">

    <button id="start">
        Start Camera
    </button>

    <button
        id="stop"
        class="stop"
        disabled
    >
        Stop
    </button>

</div>


<script>


const video =
    document.getElementById(
        "camera"
    );


const startButton =
    document.getElementById(
        "start"
    );


const stopButton =
    document.getElementById(
        "stop"
    );


const status =
    document.getElementById(
        "status"
    );


let stream = null;

let running = false;

let sending = false;


const canvas =
    document.createElement(
        "canvas"
    );


/* =========================================================
   SEND ONE FRAME
   ========================================================= */

async function sendFrame() {


    if (!running) {

        return;

    }


    if (sending) {

        return;

    }


    if (
        video.videoWidth === 0
        ||
        video.videoHeight === 0
    ) {

        return;

    }


    sending = true;


    /*
       16:9 output
    */

    canvas.width = 640;
    canvas.height = 360;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
       Cover the complete 16:9 frame.
    */

    ctx.drawImage(

        video,

        0,
        0,

        640,
        360

    );


    canvas.toBlob(

        async function(blob) {


            if (!blob) {

                sending = false;

                return;

            }


            try {


                const formData =
                    new FormData();


                formData.append(

                    "image",

                    blob,

                    "camera.jpg"

                );


                await fetch(

                    "/upload_frame",

                    {

                        method:
                            "POST",

                        body:
                            formData,

                        cache:
                            "no-store"

                    }

                );


            }

            catch(error) {

                console.log(
                    "Upload error:",
                    error
                );

            }


            sending = false;


        },

        "image/jpeg",

        0.65

    );

}


/* =========================================================
   CAMERA LOOP
   ========================================================= */

function cameraLoop() {


    if (!running) {

        return;

    }


    sendFrame();


    setTimeout(

        cameraLoop,

        66

    );

}


/* =========================================================
   START CAMERA
   ========================================================= */

startButton.onclick =
    async function() {


    try {


        /*
           Rear camera
           1280x720 = 16:9
        */

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                "environment"

                        },

                        width: {

                            ideal:
                                1280

                        },

                        height: {

                            ideal:
                                720

                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        running = true;


        startButton.disabled =
            true;

        stopButton.disabled =
            false;


        status.textContent =
            "🟢 Camera streaming";


        status.style.color =
            "#00ff55";


        cameraLoop();


    }

    catch(error) {


        console.error(
            error
        );


        status.textContent =
            "❌ Camera permission denied";


        status.style.color =
            "#ff4444";


        alert(
            "Camera permission allow karo."
        );

    }

};


/* =========================================================
   STOP
   ========================================================= */

stopButton.onclick =
    function() {


    running = false;


    if (stream) {


        stream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        stream = null;

    }


    video.srcObject =
        null;


    startButton.disabled =
        false;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped";


    status.style.color =
        "#fff";

};


</script>


</body>

</html>
