<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedTracker Camera</title>
<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}
#camera{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    background:#000;
}
.top{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    padding:8px 14px;
    border-radius:20px;
    background:rgba(0,0,0,.65);
    font-size:13px;
}
.controls{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    display:flex;
    gap:10px;
}
button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    font-weight:bold;
    color:#fff;
    background:#00a83b;
}
button.stop{background:#d62828}
button:disabled{opacity:.4}
.hint{
    position:fixed;
    bottom:75px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    padding:7px 12px;
    border-radius:8px;
    background:rgba(0,0,0,.55);
    font-size:12px;
    white-space:nowrap;
}
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>

<div class="top" id="status">Camera stopped</div>

<div class="hint">
    📱 Landscape • rear camera • keep the phone fixed
</div>

<div class="controls">
    <button id="start">Start Camera</button>
    <button id="stop" class="stop" disabled>Stop</button>
</div>

<script>
const video = document.getElementById("camera");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const statusEl = document.getElementById("status");

let stream = null;
let running = false;
let sending = false;

const canvas = document.createElement("canvas");
canvas.width = 640;
canvas.height = 360;

function setStatus(text, color="#fff"){
    statusEl.textContent = text;
    statusEl.style.color = color;
}

function drawContain(ctx, video, cw, ch){
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,cw,ch);

    if(!vw || !vh) return;

    const scale = Math.min(cw/vw, ch/vh);
    const w = vw * scale;
    const h = vh * scale;
    const x = (cw-w)/2;
    const y = (ch-h)/2;

    ctx.drawImage(video, x, y, w, h);
}

async function sendFrame(){
    if(!running || sending) return;
    if(!video.videoWidth || !video.videoHeight) return;

    sending = true;

    const ctx = canvas.getContext("2d", {alpha:false});

    drawContain(
        ctx,
        video,
        canvas.width,
        canvas.height
    );

    canvas.toBlob(async blob=>{
        if(!blob){
            sending = false;
            return;
        }

        try{
            const fd = new FormData();
            fd.append("image", blob, "camera.jpg");

            await fetch("/upload_frame", {
                method:"POST",
                body:fd,
                cache:"no-store"
            });
        }catch(e){
            console.log("Upload error:", e);
        }

        sending = false;
    }, "image/jpeg", 0.72);
}

function cameraLoop(){
    if(!running) return;

    sendFrame();

    setTimeout(
        cameraLoop,
        Math.round(1000 / 18)
    );
}

startButton.onclick = async ()=>{
    try{
        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:{ideal:"environment"},
                width:{ideal:1280},
                height:{ideal:720},
                frameRate:{ideal:30,max:30}
            },
            audio:false
        });

        video.srcObject = stream;

        await video.play();

        running = true;

        startButton.disabled = true;
        stopButton.disabled = false;

        setStatus(
            "🟢 Camera streaming",
            "#00ff55"
        );

        // Some mobile browsers only allow orientation lock
        // after user interaction.
        try{
            if(screen.orientation && screen.orientation.lock){
                await screen.orientation.lock("landscape");
            }
        }catch(e){
            console.log("Orientation lock unavailable");
        }

        cameraLoop();

    }catch(error){
        console.error(error);

        setStatus(
            "❌ Camera permission denied",
            "#ff4444"
        );

        alert(
            "Camera permission allow karo aur phone ko LANDSCAPE me rakho."
        );
    }
};

stopButton.onclick = ()=>{
    running = false;

    if(stream){
        stream.getTracks().forEach(track=>track.stop());
        stream = null;
    }

    video.srcObject = null;

    startButton.disabled = false;
    stopButton.disabled = true;

    setStatus("Camera stopped");
};
</script>

</body>
</html>
