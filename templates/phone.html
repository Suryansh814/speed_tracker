<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Stream Source</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
        }
        #videoElement {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .info {
            margin-top: 15px;
            text-align: center;
            color: #cccccc;
            max-width: 80%;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        button.stop {
            background-color: #f44336;
        }
    </style>
</head>
<body>
    <h1>Camera Feed</h1>
    <video id="videoElement" autoplay playsinline></video>
    
    <div class="controls">
        <button id="startButton">Start Streaming</button>
        <button id="stopButton" class="stop">Stop Streaming</button>
    </div>
    
    <p class="info">This feed is being sent to the server for processing. Make sure your phone and laptop are on the same network.</p>

   <!-- ... previous HTML code continues ... -->

    <script>
        const video = document.getElementById('videoElement');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        let stream = null;
        let intervalId = null;
        
        // Function to capture and send frame
        function captureAndSendFrame() {
            if (!stream) return;
            
            // Create a canvas to capture the current frame
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert canvas to blob
            canvas.toBlob(blob => {
                if (blob) {
                    const formData = new FormData();
                    formData.append('image', blob);
                    
                    // Send frame to server
                    fetch('/upload_frame', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status !== 'success') {
                            console.error('Error uploading frame:', data);
                        }
                    })
                    .catch(error => {
                        console.error('Error uploading frame:', error);
                    });
                }
            }, 'image/jpeg', 0.8); // 80% quality
        }
        
        // Function to start streaming
        function startStreaming() {
            if (navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment", // Use rear camera
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                })
                .then(function(s) {
                    stream = s;
                    video.srcObject = stream;
                    
                    // Start capturing frames every 100ms
                    intervalId = setInterval(captureAndSendFrame, 100);
                    
                    startButton.disabled = true;
                    stopButton.disabled = false;
                })
                .catch(function(error) {
                    console.log("Something went wrong!", error);
                    alert("Camera access denied or not available.");
                });
            } else {
                alert("Your browser does not support camera access.");
            }
        }
        
        // Function to stop streaming
        function stopStreaming() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            
            video.srcObject = null;
            startButton.disabled = false;
            stopButton.disabled = true;
        }
        
        // Event listeners
        startButton.addEventListener('click', startStreaming);
        stopButton.addEventListener('click', stopStreaming);
        
        // Initial state
        stopButton.disabled = true;
    </script>
</body>
</html>
