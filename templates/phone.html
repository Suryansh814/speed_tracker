<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Phone Camera | Speed Tracker</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #050505;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;

    display: flex;

    justify-content: center;
}

.container {

    width: 100%;

    max-width: 600px;

    padding: 20px;

    text-align: center;
}

.header {

    margin-bottom: 20px;
}

.header h1 {

    margin: 0;

    font-size: 24px;
}

.header p {

    color: #999;

    font-size: 14px;
}

.camera-box {

    position: relative;

    width: 100%;

    background: #111;

    border-radius: 15px;

    overflow: hidden;

    border: 1px solid #292929;
}

video {

    width: 100%;

    display: block;

    background: black;
}

.status {

    margin-top: 15px;

    padding: 12px;

    border-radius: 10px;

    background: #181818;

    font-size: 14px;
}

.status.connected {

    color: #00ff88;
}

.status.disconnected {

    color: #ff5555;
}

.controls {

    display: flex;

    gap: 10px;

    margin-top: 15px;
}

button {

    flex: 1;

    padding: 15px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.start {

    background: #00c853;

    color: white;
}

.stop {

    background: #d50000;

    color: white;
}

button:disabled {

    opacity: 0.4;

}

.info {

    margin-top: 20px;

    padding: 15px;

    background: #101010;

    border-radius: 10px;

    color: #aaa;

    font-size: 13px;

    line-height: 1.6;
}

</style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>📱 Phone Camera</h1>

        <p>Speed Tracker Camera Source</p>

    </div>


    <div class="camera-box">

        <video
            id="video"
            autoplay
            playsinline>
        </video>

    </div>


    <div
        id="status"
        class="status disconnected">

        🔴 Camera not started

    </div>


    <div class="controls">

        <button
            id="start"
            class="start">

            Start Camera

        </button>


        <button
            id="stop"
            class="stop"
            disabled>

            Stop

        </button>

    </div>


    <div class="info">

        <b>How to use:</b>

        <br><br>

        1. Press <b>Start Camera</b>

        <br>

        2. Allow camera permission

        <br>

        3. Keep the phone facing the road

        <br>

        4. Keep this page open

        <br>

        5. Open the Monitor page on your laptop

    </div>

</div>


<script>

const video =
    document.getElementById("video");

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const status =
    document.getElementById("status");

let stream = null;

let captureInterval = null;

let sending = false;


// ======================================================
// START CAMERA
// ======================================================

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 640
                    },

                    height: {
                        ideal: 480
                    }
                },

                audio: false
            });


        video.srcObject = stream;


        status.innerHTML =
            "🟢 Camera connected & sending";

        status.className =
            "status connected";


        startButton.disabled = true;

        stopButton.disabled = false;


        captureInterval =
            setInterval(
                captureFrame,
                120
            );

    }

    catch(error) {

        console.error(error);

        status.innerHTML =
            "🔴 Camera permission denied";

        status.className =
            "status disconnected";

        alert(
            "Camera access is required."
        );
    }
}


// ======================================================
// CAPTURE FRAME
// ======================================================

function captureFrame() {

    if (!stream ||
        video.videoWidth === 0 ||
        sending) {

        return;
    }


    sending = true;


    const canvas =
        document.createElement("canvas");


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext("2d");


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(

        async function(blob) {

            if (!blob) {

                sending = false;

                return;
            }


            const formData =
                new FormData();


            formData.append(
                "image",
                blob,
                "frame.jpg"
            );


            try {

                await fetch(
                    "/upload_frame",
                    {

                        method: "POST",

                        body: formData
                    }
                );

            }

            catch(error) {

                console.error(
                    "Upload error:",
                    error
                );

                status.innerHTML =
                    "🟠 Connection problem";
            }


            sending = false;

        },

        "image/jpeg",

        0.65
    );
}


// ======================================================
// STOP CAMERA
// ======================================================

function stopCamera() {

    if (captureInterval) {

        clearInterval(
            captureInterval
        );

        captureInterval = null;
    }


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;
    }


    video.srcObject = null;


    startButton.disabled = false;

    stopButton.disabled = true;


    status.innerHTML =
        "🔴 Camera stopped";

    status.className =
        "status disconnected";
}


startButton
    .addEventListener(
        "click",
        startCamera
    );


stopButton
    .addEventListener(
        "click",
        stopCamera
    );

</script>

</body>

</html>
