<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Speed Tracker - Live View</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
        }
        .container {
            text-align: center;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            background-color: #1e1e1e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-width: 800px;
            width: 95%;
        }
        #videoStream {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #000;
        }
        .info {
            margin-top: 15px;
            font-size: 1.1em;
            color: #bbbbbb;
        }
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
        }
        .status.active {
            background-color: #2a7f2a;
        }
        .status.inactive {
            background-color: #7f2a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vehicle Speed Tracker - Live View</h1>
        <img src="{{ url_for('static', filename='placeholder.jpg') }}" id="videoStream" alt="Live Video Stream">
        <div id="status" class="status inactive">Waiting for camera feed...</div>
        <p class="info">Live feed from phone camera with speed detection...</p>
    </div>

    <script>
        const videoElement = document.getElementById('videoStream');
        const statusElement = document.getElementById('status');
        
        // Create a placeholder image if needed
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 640, 480);
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.fillText('Waiting for camera feed...', 200, 240);
        
        // Convert canvas to data URL
        const placeholderUrl = canvas.toDataURL('image/jpeg');
        videoElement.src = placeholderUrl;
        
        // Function to update the video stream
        function updateStream() {
            fetch('/video_feed')
                .then(response => {
                    if (response.ok) {
                        statusElement.textContent = 'Camera feed active';
                        statusElement.className = 'status active';
                        videoElement.src = '/video_feed';
                    } else {
                        statusElement.textContent = 'Camera feed not available';
                        statusElement.className = 'status inactive';
                        videoElement.src = placeholderUrl;
                    }
                })
                .catch(error => {
                    console.error('Error fetching stream:', error);
                    statusElement.textContent = 'Error connecting to camera';
                    statusElement.className = 'status inactive';
                    videoElement.src = placeholderUrl;
                });
        }
        
        // Update stream every 5 seconds
        setInterval(updateStream, 5000);
        
        // Initial update
        updateStream();
    </script>
</body>
</html>
