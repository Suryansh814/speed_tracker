<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Speed Tracker V2</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #080808;

    color: white;

    font-family: Arial, sans-serif;
}

.header {

    padding: 18px 25px;

    border-bottom: 1px solid #222;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.logo {

    font-size: 22px;

    font-weight: bold;
}

.logo span {

    color: #00ff88;
}

.connection {

    padding: 8px 14px;

    border-radius: 20px;

    background: #151515;

    font-size: 13px;
}

.dashboard {

    max-width: 1450px;

    margin: auto;

    padding: 20px;
}

.video-card {

    background: #111;

    border: 1px solid #252525;

    border-radius: 14px;

    overflow: hidden;
}

.video-header {

    padding: 15px 20px;

    display: flex;

    justify-content: space-between;

    border-bottom: 1px solid #222;
}

.live {

    color: #00ff88;

    font-weight: bold;

    font-size: 13px;
}

.video-wrapper {

    background: black;

    text-align: center;
}

#video {

    width: 100%;

    max-height: 70vh;

    object-fit: contain;

    display: block;
}

.stats {

    display: grid;

    grid-template-columns:
    repeat(3, 1fr);

    gap: 15px;

    margin-top: 18px;
}

.stat {

    background: #111;

    border: 1px solid #252525;

    border-radius: 12px;

    padding: 18px;
}

.stat-title {

    color: #777;

    font-size: 12px;
}

.stat-value {

    font-size: 28px;

    font-weight: bold;

    margin-top: 8px;
}

.green {

    color: #00ff88;
}

.yellow {

    color: #ffff00;
}

.red {

    color: #ff4444;
}

.panel {

    margin-top: 18px;

    background: #111;

    border: 1px solid #252525;

    border-radius: 12px;

    overflow: hidden;
}

.panel-title {

    padding: 15px 18px;

    font-weight: bold;

    border-bottom: 1px solid #222;
}

table {

    width: 100%;

    border-collapse: collapse;
}

th, td {

    padding: 13px;

    text-align: left;

    border-bottom: 1px solid #202020;

    font-size: 14px;
}

th {

    color: #777;

    font-size: 11px;
}

.status-normal {

    color: #00ff88;
}

.status-moderate {

    color: #ffff00;
}

.status-speeding {

    color: #ff4444;
}

.empty {

    color: #666;

    text-align: center;

    padding: 25px;
}

@media(max-width: 700px) {

    .stats {

        grid-template-columns: 1fr;
    }

    .dashboard {

        padding: 10px;
    }
}

</style>

</head>


<body>

<header class="header">

    <div class="logo">
        🚗 Speed<span>Tracker</span> V2
    </div>

    <div
    id="connection"
    class="connection">

        🔴 Camera Offline

    </div>

</header>


<main class="dashboard">


    <!-- VIDEO -->

    <div class="video-card">

        <div class="video-header">

            <strong>
                Live Road Monitoring
            </strong>

            <span class="live">
                ● LIVE
            </span>

        </div>

        <div class="video-wrapper">

            <img
            id="video"
            src="/video_feed">

        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                VEHICLES IN FRAME
            </div>

            <div
            id="vehicleCount"
            class="stat-value">

                0

            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                HIGHEST SPEED
            </div>

            <div
            id="highestSpeed"
            class="stat-value green">

                0 km/h

            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                TOTAL DETECTED
            </div>

            <div
            id="totalDetected"
            class="stat-value">

                0

            </div>

        </div>

    </div>


    <!-- LIVE VEHICLES -->

    <div class="panel">

        <div class="panel-title">
            🚦 Live Vehicles
        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>TYPE</th>

                    <th>SPEED</th>

                    <th>MAX SPEED</th>

                    <th>STATUS</th>

                </tr>

            </thead>

            <tbody
            id="liveVehicles">

                <tr>

                    <td
                    colspan="5"
                    class="empty">

                        No vehicles detected

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- HISTORY -->

    <div class="panel">

        <div class="panel-title">
            📋 Vehicle History
        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>TYPE</th>

                    <th>MAX SPEED</th>

                    <th>TIME</th>

                </tr>

            </thead>

            <tbody
            id="history">

                <tr>

                    <td
                    colspan="4"
                    class="empty">

                        No history yet

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<script>

async function updateDashboard() {

    try {

        const response =
            await fetch("/status");

        const data =
            await response.json();


        // Connection

        const connection =
            document.getElementById(
                "connection"
            );


        if (data.camera_active) {

            connection.innerHTML =
                "🟢 Camera Connected";

            connection.style.color =
                "#00ff88";

        } else {

            connection.innerHTML =
                "🔴 Camera Offline";

            connection.style.color =
                "#ff4444";
        }


        // Stats

        document.getElementById(
            "vehicleCount"
        ).textContent =
            data.vehicle_count;


        document.getElementById(
            "highestSpeed"
        ).textContent =
            Math.round(
                data.highest_speed
            ) + " km/h";


        document.getElementById(
            "totalDetected"
        ).textContent =
            data.total_detected;


        // Highest speed color

        const highest =
            document.getElementById(
                "highestSpeed"
            );


        highest.className =
            "stat-value " +
            (
                data.highest_speed >= 60
                ? "red"
                : data.highest_speed >= 40
                ? "yellow"
                : "green"
            );


        // ----------------------------------------------------
        // LIVE VEHICLES
        // ----------------------------------------------------

        const live =
            document.getElementById(
                "liveVehicles"
            );


        if (
            data.vehicles.length === 0
        ) {

            live.innerHTML = `
                <tr>
                    <td colspan="5"
                    class="empty">
                    No vehicles detected
                    </td>
                </tr>
            `;

        } else {

            live.innerHTML =
                data.vehicles.map(
                    vehicle => {

                        let statusClass =
                            "status-normal";

                        if (
                            vehicle.status
                            === "MODERATE"
                        ) {

                            statusClass =
                                "status-moderate";

                        }

                        if (
                            vehicle.status
                            === "SPEEDING"
                        ) {

                            statusClass =
                                "status-speeding";
                        }


                        return `
                        <tr>

                            <td>
                                #${vehicle.id}
                            </td>

                            <td>
                                ${vehicle.type}
                            </td>

                            <td>
                                <b>
                                ${Math.round(
                                    vehicle.speed
                                )} km/h
                                </b>
                            </td>

                            <td>
                                ${Math.round(
                                    vehicle.max_speed
                                )} km/h
                            </td>

                            <td class="${statusClass}">
                                ${vehicle.status}
                            </td>

                        </tr>
                        `;

                    }
                ).join("");
        }


        // ----------------------------------------------------
        // HISTORY
        // ----------------------------------------------------

        const history =
            document.getElementById(
                "history"
            );


        if (
            data.history.length === 0
        ) {

            history.innerHTML = `
                <tr>
                    <td colspan="4"
                    class="empty">
                    No history yet
                    </td>
                </tr>
            `;

        } else {

            history.innerHTML =
                [...data.history]
                .reverse()
                .map(
                    item => `
                    <tr>

                        <td>
                            #${item.id}
                        </td>

                        <td>
                            ${item.type}
                        </td>

                        <td>
                            ${item.max_speed}
                            km/h
                        </td>

                        <td>
                            ${item.time}
                        </td>

                    </tr>
                    `
                ).join("");
        }

    }

    catch(error) {

        console.error(
            "Dashboard error:",
            error
        );
    }
}


// Update every second

setInterval(
    updateDashboard,
    1000
);

updateDashboard();

</script>

</body>

</html>
