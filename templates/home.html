<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Speed Tracker</title>

<style>

body {

    margin: 0;

    background: #080808;

    color: white;

    font-family: Arial;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;
}

.container {

    width: 90%;

    max-width: 600px;
}

h1 {

    font-size: 42px;

    margin-bottom: 10px;
}

p {

    color: #888;

    margin-bottom: 35px;
}

.buttons {

    display: flex;

    gap: 15px;

    justify-content: center;

    flex-wrap: wrap;
}

a {

    text-decoration: none;

    padding: 16px 25px;

    border-radius: 10px;

    font-weight: bold;
}

.phone {

    background: #00c853;

    color: white;
}

.monitor {

    background: #222;

    color: white;

    border: 1px solid #444;
}

</style>

</head>


<body>

<div class="container">

    <h1>
        🚗 Speed Tracker
    </h1>

    <p>
        Real-time vehicle speed monitoring
        using phone camera + OpenCV.
    </p>


    <div class="buttons">

        <a
            href="/phone"
            class="phone">

            📱 Phone Camera

        </a>


        <a
            href="/monitor"
            class="monitor">

            💻 Monitor Dashboard

        </a>

    </div>

</div>

</body>

</html>
